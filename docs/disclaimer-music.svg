    <text x="396" y="690">本项目与其无关联，亦未获得其授权或背书。</text>
    <text x="150" y="746">配　　乐　 “Imperial Advance” by Jesper Kyd（© Fatshark），未获商业授权，</text>
    <text x="396" y="788">仅作非商业同人展示；权利人要求即刻移除。</text>
    <text x="150" y="844">其余内容　 场景、骨骼、动作、贴图、灯光、脚本均为本项目原创。</text>
  </g>

  <rect x="150" y="892" width="900" height="2" fill="url(#fade)"/>

  <text x="150" y="936" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#8a7f6a">
    权利人如认为本作品侵犯其权益，请通过仓库 Issues 联系，将在 48 小时内删除相关内容。
  </text>
  <text x="150" y="982" font-family="Georgia, serif" font-size="20" letter-spacing="1.5" fill="#8a7f6a">
    github.com/letsgetfun/ai-procedural-cinema
  </text>

  <!-- 右侧印章 -->
  <g opacity="0.5">
    <circle cx="1570" cy="560" r="150" fill="none" stroke="#8f6f2a" stroke-width="2"/>
    <circle cx="1570" cy="560" r="132" fill="none" stroke="#8f6f2a" stroke-width="1"/>
    <text x="1570" y="528" text-anchor="middle" font-family="Microsoft YaHei, sans-serif"
          font-size="34" fill="#c8a34a" letter-spacing="8">非商业</text>
    <text x="1570" y="576" text-anchor="middle" font-family="Microsoft YaHei, sans-serif"
          font-size="34" fill="#c8a34a" letter-spacing="8">学习用途</text>
    <text x="1570" y="622" text-anchor="middle" font-family="Georgia, serif"
          font-size="17" fill="#8a7f6a" letter-spacing="3">NON-COMMERCIAL</text>
  </g>
