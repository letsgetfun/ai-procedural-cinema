<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#151009"/>
      <stop offset="60%" stop-color="#0b0805"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8f6f2a"/>
      <stop offset="45%" stop-color="#e8c877"/>
      <stop offset="100%" stop-color="#a8842f"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8a34a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c8a34a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c8a34a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 外框 -->
  <rect x="72" y="72" width="1776" height="936" fill="none" stroke="url(#gold)" stroke-width="2.2" opacity="0.85"/>
  <rect x="84" y="84" width="1752" height="912" fill="none" stroke="#c8a34a" stroke-width="0.8" opacity="0.35"/>

  <!-- 顶部标签 -->
  <text x="150" y="176" font-family="Georgia, serif" font-size="26" letter-spacing="12"
