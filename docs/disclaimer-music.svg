  <rect x="150" y="462" width="900" height="2" fill="url(#fade)"/>

  <!-- 条目 -->
  <g font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#d8cbb4">
    <text x="150" y="536">非商业用途：不含广告、赞助、付费分发或任何形式的变现。</text>
